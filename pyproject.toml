[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collectbase"
version = "0.2.0"
description = "A layered record filesystem for agents — layers are git branches, and the fact layer is a floor the agent cannot reach."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "memory.co", email = "twwy.zh@gmail.com" }]
keywords = ["git", "layers", "agents", "memory", "provenance", "filesystem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/memory-co/collectbase"
Repository = "https://github.com/memory-co/collectbase"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
cb = "collectbase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["collectbase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
